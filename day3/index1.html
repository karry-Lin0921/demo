<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>创建分支</title>

</head>
<body>
    <h1>git 的分支操作</h1>
    <p>git branch 创建分支</p>
    <p>git checkout 切换分支</p>
    <p>git branch -m 重命名分支</p>
    <p>git branch -a 查看所有分支</p>
    <p>git branch -r 查看远程分支</p>
    <p>git push origin 分支名 将本地分支推送到远程</p>
    <p>git branch -d 删除分支</p>
    <p>git branch -D 强制删除分支</p>
    <p>git merge 合并分支</p>
</body>
</html>
